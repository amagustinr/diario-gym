name: App web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Cada publicación cambia la versión del caché del service worker y de los archivos para que los teléfonos tomen la versión nueva
      - name: Versionar caché
        run: |
          sed -i "s/diario-gym-v1/diario-gym-${{ github.run_number }}/" web/sw.js
          sed -i "s/?v=dev/?v=${{ github.run_number }}/g" web/index.html
          sed -i 's/const VERSION="dev"/const VERSION="${{ github.run_number }}"/' web/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
